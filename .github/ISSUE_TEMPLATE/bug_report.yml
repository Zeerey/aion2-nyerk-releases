name: Bug report
description: Tell us what went wrong so we can reproduce it.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Nyerk. Check existing issues first.
        **This report is public. Do not attach raw packet captures, credentials or your application-data folder.**
        You can also use Report a bug inside Nyerk to prepare an application summary.
  - type: input
    id: version
    attributes:
      label: Nyerk version
      placeholder: "For example: 1.0.0-rc.28"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where does the problem happen?
      options:
        - Overview or characters
        - Pets
        - Combat or DPS
        - Timers
        - Companion popout
        - Network or diagnostic recording
        - Updates or launch
        - Settings or another area
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 10 or Windows 11; build if known"
  - type: textarea
    id: result
    attributes:
      label: What happened, and what did you expect?
      description: Include the exact error text if there is one.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open...
        2. Choose...
        3. The problem appears...
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Optional context or screenshots
      description: For combat, include final damage, DPS, duration and target scope from the same fight. Mention whether Nyerk started before login or mid-fight. Review images before sharing.
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I have removed private information and have not attached raw packet captures.
          required: true
